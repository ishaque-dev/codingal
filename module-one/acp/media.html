<!DOCTYPE html>
<html>
<head>
    <title>My Media Page</title>
</head>
<body>
    <h2>Adding an Image</h2>
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/HTML5_logo_and_wordmark.svg/200px-HTML5_logo_and_wordmark.svg.png" alt="HTML5 Logo" width="150">

    <h2>Adding Audio</h2>
    <audio controls>
        <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
    </audio>

    <h2>Adding Video</h2>
    <video width="320" height="240" controls>
        <source src="https://www.w3schools.com/html/movie.mp4" type="video/mp4">
    </video>

    <h2>Adding an Iframe</h2>
    <p>Here is Wikipedia loaded inside a frame!</p>
    <iframe src="https://en.wikipedia.org/wiki/HTML" width="100%" height="300" title="Wikipedia HTML"></iframe>
</body>
</html>
