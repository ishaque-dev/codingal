<!DOCTYPE html>
<html>
<head>
    <title>HTML Lists</title>
</head>
<body>

    <h2>Unordered List (Bullet Points)</h2>
    <p>My favorite programming languages:</p>
    <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <h2>Ordered List (Numbered)</h2>
    <p>Steps to create a webpage:</p>
    <ol>
        <li>Open VS Code.</li>
        <li>Write the HTML boilerplate.</li>
        <li>Add content and tags.</li>
        <li>Save as an .html file.</li>
    </ol>

</body>
</html>
