<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Group the Form Fields</title>
</head>
<body>

    <h2>Form with Fieldsets</h2>

    <form>
        <!-- fieldset creates a box around the inputs -->
        <fieldset>
            <!-- legend provides a title for the fieldset box -->
            <legend>Contact Information:</legend>
            
            <label for="phone">Phone Number:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>
            
            <label for="address">Address:</label><br>
            <input type="text" id="address" name="address"><br><br>
        </fieldset>
        <br>
        <input type="submit" value="Save Contact">
    </form>

</body>
</html>
