<!DOCTYPE html>
<html>
<head>
    <title>HTML Images</title>
</head>
<body>

    <h2>Learning to Add Images</h2>
    
    <p>Here is an example of an image added to the webpage:</p>
    
    <!-- The img tag uses 'src' for the image link and 'alt' for a text description -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/HTML5_logo_and_wordmark.svg/200px-HTML5_logo_and_wordmark.svg.png" alt="HTML5 Logo" width="200">

</body>
</html>
