<!DOCTYPE html>
<html>
<head>
    <title>Heading and Paragraph</title>
</head>
<body>

    <h1>This is Heading 1 (Largest)</h1>
    <p>This is a standard paragraph of text that sits below the largest heading.</p>

    <h2>This is Heading 2</h2>
    <p>HTML has six different levels of headings that you can use to structure your page.</p>

    <h3>This is Heading 3</h3>
    <h4>This is Heading 4</h4>
    <h5>This is Heading 5</h5>
    <h6>This is Heading 6 (Smallest)</h6>

</body>
</html>
