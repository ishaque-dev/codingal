<!DOCTYPE html>
<html>
<head>
    <title>HTML Links</title>
</head>
<body>

    <h2>Learning Hyperlinks</h2>
    
    <p>Hyperlinks allow us to navigate between web pages.</p>
    
    <!-- Link that opens in the same tab -->
    <p>Click here to visit <a href="https://www.wikipedia.org/">Wikipedia</a>.</p>
    
    <!-- Link that opens in a new tab using target="_blank" -->
    <p>Click here to search on <a href="https://www.google.com/" target="_blank">Google (opens in a new tab)</a>.</p>

</body>
</html>
