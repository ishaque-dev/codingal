<!DOCTYPE html>
<html>
<head>
    <title>HTML Iframe</title>
</head>
<body>

    <h2>Embedding a Webpage (Iframe)</h2>
    
    <p>The iframe tag allows us to embed another document within our current HTML page. Below is Wikipedia loaded inside an iframe!</p>
    
    <!-- The width and height attributes control the size of the embedded window -->
    <iframe src="https://en.wikipedia.org/wiki/Main_Page" width="100%" height="400" title="Wikipedia Homepage"></iframe>

</body>
</html>
